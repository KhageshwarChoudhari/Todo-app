<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleSheet/output.css">
    <title>ToDo App</title>
</head>

<body class="bg-slate-100 justify-center min-h-screen flex">
    <div class="bg-white w-full max-w-md mx-auto rounded-lg">
        <header class="bg-indigo-500 text-white p-5 rounded-lg shadow-md">
            <h1>Todo App</h1>
        </header>
        <main class="p-5">
            <form id="todo-form" action="" class="flex  gap-3 h-12">
                <input type="text" id="todo-input" placeholder="Add a new task"
                    class=" h-full border border-gray-300 rounded-lg p-2 w-full mb-4 hover:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <button id="formBtn" type="submit" class=" bg-indigo-500 text-white px-4 h-full rounded-lg "> Add
                </button>
            </form>

            <div class="w-full flex justify-between item-center  border-b text-xs  border-black mb-4 pt-6 pb-1">
               <p class="text-gray-700">TASKS : <span id="total-tasks"></span></p>
               <p class="text-green-500">COMPLETED : <span id="completed-tasks"></span></p>
            </div>

            <ul id="todo-list" class="flex flex-col gap-1">
            </ul>
        </main>

    </div>
</body>
<script src="index.js"></script>

</html>
